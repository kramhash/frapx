name: Deploy Docs Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "apps/flowmap-painter/**"
      - "examples/vite-sdf-skull/**"
      - "packages/core/**"
      - "packages/fx-canvas/**"
      - "packages/fx-passes/**"
      - "packages/fx-particles/**"
      - "packages/react-canvas/**"
      - "packages/react-particles/**"
      - "packages/glsl-flowmap/**"
      - "packages/glsl-noise/**"
      - "packages/glsl-sdf/**"
      - "packages/glsl-sdf-volume/**"
      - "packages/glsl-raymarch/**"
      - "packages/tool-capture/**"
      - "packages/tool-render/**"
      - "packages/tool-dev/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @frapx/docs (Live Demo page) and @frapx/flowmap-painter both depend
      # on published packages' dist/ output, not their source.
      - name: Build packages
        run: pnpm build

      - name: Build docs site
        run: pnpm --filter @frapx/docs build

      - name: Build flowmap-painter
        run: pnpm --filter @frapx/flowmap-painter build

      - name: Build the sdf-skull demo
        run: pnpm --filter @frapx/example-vite-sdf-skull build

      # The docs site is the Pages root (base "/frapx/"); flowmap-painter is
      # nested under it at "/frapx/playground/" (see its vite.config.ts base).
      - name: Merge flowmap-painter into docs under /playground
        run: |
          mkdir -p apps/docs/dist/playground
          cp -r apps/flowmap-painter/dist/. apps/docs/dist/playground/

      # Showcase demos live at "/frapx/demos/<name>/"; their builds use a
      # relative base, so they work from any folder.
      - name: Merge demos into docs under /demos
        run: |
          mkdir -p apps/docs/dist/demos/sdf-skull
          cp -r examples/vite-sdf-skull/dist/. apps/docs/dist/demos/sdf-skull/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
