name: Deploy Docs Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "apps/flowmap-painter/**"
      - "apps/playground/**"
      - "examples/vite-sdf-skull/**"
      - "packages/core/**"
      - "packages/fx-canvas/**"
      - "packages/fx-passes/**"
      - "packages/fx-particles/**"
      - "packages/react-canvas/**"
      - "packages/react-particles/**"
      - "packages/glsl-flowmap/**"
      - "packages/glsl-noise/**"
      - "packages/glsl-sdf/**"
      - "packages/glsl-sdf-volume/**"
      - "packages/glsl-raymarch/**"
      - "packages/tool-capture/**"
      - "packages/tool-render/**"
      - "packages/tool-dev/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @frapx/docs (Live Demo page) depends on published packages' dist/
      # output, not their source.
      - name: Build packages
        run: pnpm build

      # GA4 (growth plan decision 41): the repository variable
      # GA_MEASUREMENT_ID turns measurement on; without it no tag is emitted.
      - name: Build docs site
        run: pnpm --filter @frapx/docs build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Build playground
        run: pnpm --filter @frapx/playground build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Build flowmap-painter
        run: pnpm --filter @frapx/flowmap-painter build

      - name: Build the sdf-skull demo
        run: pnpm --filter @frapx/example-vite-sdf-skull build

      # The docs site is the Pages root (base "/frapx/"); each app is nested
      # under it at the path its vite.config.ts base names.
      - name: Merge playground into docs under /playground
        run: |
          mkdir -p apps/docs/dist/playground
          cp -r apps/playground/dist/. apps/docs/dist/playground/

      - name: Merge flowmap-painter into docs under /tools/flowmap-painter
        run: |
          mkdir -p apps/docs/dist/tools/flowmap-painter
          cp -r apps/flowmap-painter/dist/. apps/docs/dist/tools/flowmap-painter/

      # Showcase demos live at "/frapx/demos/<name>/"; their builds use a
      # relative base, so they work from any folder.
      - name: Merge demos into docs under /demos
        run: |
          mkdir -p apps/docs/dist/demos/sdf-skull
          cp -r examples/vite-sdf-skull/dist/. apps/docs/dist/demos/sdf-skull/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
